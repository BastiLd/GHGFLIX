name: Build signed Windows update
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: windows-update-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Validate release version and signing configuration
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") { throw 'Release tag and app version differ' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'TAURI_SIGNING_PRIVATE_KEY secret is missing' }
      - run: npm ci
      - run: npm test
      - name: Build signed EXE and MSI
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis,msi
      - run: node scripts/windows-update-manifest.mjs
      - name: Verify signatures and reject tampered installers
        shell: pwsh
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe,src-tauri/target/release/bundle/msi/*.msi | ForEach-Object FullName)
          cargo run --manifest-path src-tauri/Cargo.toml --example verify-update -- @files
          if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-update
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.sig
            latest.json
      # Never creates a release. Only adds signed updates to a release that
      # the repository owner has already published at this exact source tag.
      - name: Attach to the published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe,src-tauri/target/release/bundle/nsis/*.sig,src-tauri/target/release/bundle/msi/*.msi,src-tauri/target/release/bundle/msi/*.sig | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG @files latest.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Update upload failed' }
