# Builds the GHGFlix server image and publishes it to GitHub Container
# Registry on every push (to main, or the feature branch below) that touches
# server/ — so the ZimaOS docker-compose can simply pull
# ghcr.io/bastild/ghgflix-server:latest.
name: Publish server image

on:
  push:
    branches: [main, feature/zimaos-docker-server]
    paths: ["server/**", "src/**", "public/**", "index.html", "package.json", "vite.config.ts", ".github/workflows/docker.yml"]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Die Versionsnummer wird AUS server/package.json gelesen, nicht hier
      # eingetippt. Vorher stand hier fest "2.3.2", waehrend der Server im Code
      # laengst 2.4.0 meldete — ein Abbild ":2.4.0" gab es also nie. Wer in
      # ZimaOS brav die im Bericht genannte Version eintrug, bekam einen Pull-
      # Fehler statt eines Updates. Ab jetzt kann das nicht mehr auseinander
      # laufen.
      - name: Version aus server/package.json lesen
        id: version
        run: echo "v=$(node -p "require('./server/package.json').version")" >> "$GITHUB_OUTPUT"

      # Sicherheitsnetz: meldet der laufende Server eine andere Nummer als
      # package.json, bricht der Bau ab — sonst zeigt /api/ping spaeter etwas
      # anderes an als das Abbild heisst.
      - name: Version gegen src/index.js pruefen
        run: |
          IM_CODE=$(node -p "require('fs').readFileSync('server/src/index.js','utf8').match(/const VERSION = \"([^\"]+)\"/)[1]")
          if [ "$IM_CODE" != "${{ steps.version.outputs.v }}" ]; then
            echo "::error::server/package.json sagt ${{ steps.version.outputs.v }}, server/src/index.js sagt $IM_CODE — bitte angleichen."
            exit 1
          fi
          echo "Version stimmt ueberein: $IM_CODE"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          # amd64 for ZimaBoard/ZimaCube, arm64 for Pi & ARM-NAS
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/bastild/ghgflix-server:latest
            ghcr.io/bastild/ghgflix-server:${{ steps.version.outputs.v }}
            ghcr.io/bastild/ghgflix-server:${{ github.sha }}
