name: Publish F-Droid repository

on:
  push:
    branches: [main]
  pull_request:
    paths: ['fdroid/**', '.github/workflows/fdroid.yml']
  release:
    types: [published, edited]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: fdroid-repository-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s fdroid/test -v

  release-notification:
    if: github.event_name == 'release' && github.repository == 'BastiLd/GHGFLIX'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Request a trusted main run without exposing signing secrets to tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run fdroid.yml --repo "$GH_REPO" --ref main

  build:
    if: github.event_name != 'release' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'BastiLd/GHGFLIX'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: fdroid-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install hash-pinned official F-Droid server tools
        run: bash fdroid/tools/install.sh
      - name: Test package, signer and publication boundaries
        run: python -m unittest discover -s fdroid/test -v
      - name: Import existing signed release APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python fdroid/tools/repository.py prepare --work-dir "$RUNNER_TEMP/fdroid-work"
      - name: Sign the index and verify it with the official tools
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: python fdroid/tools/repository.py sign --work-dir "$RUNNER_TEMP/fdroid-work" --site-dir "$RUNNER_TEMP/fdroid-public"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fdroid-public
          path: ${{ runner.temp }}/fdroid-public
          include-hidden-files: true
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fdroid-public
          path: ${{ runner.temp }}/fdroid-public
      - name: Publish only validated public files to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 fdroid/tools/deploy.py "$RUNNER_TEMP/fdroid-public"

  verify-public:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash fdroid/tools/install.sh
      - name: Verify the live F-Droid v2 index and pinned certificate
        run: |
          for attempt in $(seq 1 30); do
            if python fdroid/tools/repository.py verify-remote; then exit 0; fi
            sleep 10
          done
          exit 1
